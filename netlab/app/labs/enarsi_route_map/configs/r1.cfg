! R1 (Edge Gateway)
hostname R1
!
interface GigabitEthernet0/1
 ip address 10.1.1.1 255.255.255.252
 no shutdown
!
interface Loopback1
 ip address 192.168.10.1 255.255.255.0
!
interface Loopback2
 ip address 192.168.20.1 255.255.255.0
!
ip prefix-list PERMITTED_NETS seq 10 permit 192.168.20.0/24
! Note: 192.168.10.0/24 is excluded
!
route-map EXPORT_BGP permit 10
 match ip address prefix-list PERMITTED_NETS
!
router bgp 65100
 bgp router-id 1.1.1.1
 neighbor 10.1.1.2 remote-as 65200
 neighbor 10.1.1.2 route-map EXPORT_BGP out
 network 192.168.10.0
 network 192.168.20.0
!
end
